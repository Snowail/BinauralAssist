<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">单机物理接线示意</title>
  <desc id="desc">一台电脑使用板载声卡线路输入和 USB DAC 输出</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/>
    </marker>
  </defs>
  <rect width="1200" height="430" fill="#f8fafc"/>
  <text x="40" y="42" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">单机部署：一台 PC，至少两张声卡</text>
  <text x="40" y="68" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">板载 Realtek 负责线路输出/输入，外接 USB DAC 负责处理后输出</text>

  <rect x="40" y="100" width="220" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="150" y="145" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">游戏 / Windows</text>
  <text x="150" y="172" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">系统默认播放设备</text>
  <text x="150" y="194" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">不要选 USB DAC</text>

  <rect x="330" y="85" width="320" height="205" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="490" y="116" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">板载 Realtek 声卡</text>
  <rect x="355" y="135" width="270" height="54" rx="9" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="490" y="158" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#065f46">Line-Out 绿色 · 游戏声音</text>
  <text x="490" y="177" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#047857">3.5 mm 公对公线</text>
  <rect x="355" y="210" width="270" height="54" rx="9" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="490" y="233" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1e3a8a">Line-In 蓝色 · 线路输入</text>
  <text x="490" y="252" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#1d4ed8">必须双声道，关闭增强</text>

  <rect x="700" y="120" width="220" height="110" rx="14" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="810" y="162" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#155e75">Binaural Assist</text>
  <text x="810" y="187" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#0e7490">WASAPI 共享 · 48 kHz · 2 ch</text>
  <text x="810" y="207" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#0e7490">脚步增强 / 枪声平滑</text>

  <rect x="965" y="120" width="190" height="110" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1060" y="160" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">USB DAC</text>
  <text x="1060" y="184" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">DAWN PRO2 / 外接声卡</text>
  <text x="1060" y="205" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">第二张声卡</text>
  <text x="1060" y="275" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">耳机</text>

  <path d="M 260 150 L 350 150" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 490 189 L 490 210" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="502" y="202" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#dc2626" font-weight="600">3.5 mm 线</text>
  <path d="M 625 237 L 700 190" fill="none" stroke="#0891b2" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="635" y="228" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#0e7490">Line-In 采集</text>
  <path d="M 920 175 L 965 175" fill="none" stroke="#0891b2" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M 1060 230 L 1060 258" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="330" width="1115" height="65" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="58" y="355" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13" fill="#9a3412" font-weight="600">单机关键点：必须使用两张声卡。板载 Line-In 为双声道；外接 USB DAC 作为处理后输出。</text>
  <text x="58" y="377" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#9a3412">如果主板只有单声道 Mic-In，请不要用它代替 Line-In；改用 USB 立体声采集卡。</text>
</svg>
